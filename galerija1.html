<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Galerija — Dr Nebojša dental, Inđija</title>
<meta name="description" content="Fotografije ordinacije, opreme i rezultata terapija — Dr Nebojša dental, Inđija.">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; }
  body { margin: 0; font-family: 'Manrope', sans-serif; background: #F7F6F2; color: #12201F; -webkit-font-smoothing: antialiased; }
  * { cursor: url('assets/cursor-tooth-sm.png') 4 1, auto; }
  a, button { cursor: pointer; }
  a { color: #0E9AA4; text-decoration: none; }
  a:hover { color: #12B7C2; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  .gal-item { border-radius: 18px; overflow: hidden; position: relative; box-shadow: 0 6px 20px rgba(18,32,31,0.05); }
  .gal-item img { width: 100%; height: 100%; object-fit: cover; display: block; transition: transform .5s ease; }
  .gal-item:hover img { transform: scale(1.06); }
  @media (max-width: 820px) {
    .gal-grid { grid-template-columns: 1fr 1fr !important; grid-auto-rows: 200px !important; }
    section, nav > div { padding-left: 20px !important; padding-right: 20px !important; }
    h1 { font-size: 38px !important; }
  }
  @media (max-width: 480px) { .gal-grid { grid-template-columns: 1fr !important; } }
</style>
</helmet>

<div style="max-width:100%;overflow-x:hidden;">

<sc-if value="{{ lightboxOpen }}" hint-placeholder-val="{{ false }}">
  <div onClick="{{ closeLightbox }}" style="position:fixed;inset:0;z-index:200;background:rgba(12,18,17,0.92);backdrop-filter:blur(6px);display:flex;align-items:center;justify-content:center;padding:5vw;">
    <button onClick="{{ closeLightbox }}" aria-label="Zatvori" style="position:absolute;top:24px;right:28px;width:48px;height:48px;border-radius:50%;background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.28);color:#fff;font-size:26px;line-height:1;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s ease,transform .2s ease;" style-hover="background:rgba(255,255,255,0.24);transform:scale(1.08);">×</button>
    <button onClick="{{ prevImg }}" aria-label="Prethodna" style="position:absolute;left:3vw;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.28);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s ease,transform .2s ease,color .2s ease;" style-hover="background:linear-gradient(135deg,#16C0CA,#0E9AA4);color:#fff;transform:scale(1.08);"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg></button>
    {{ lightboxImg }}
    <button onClick="{{ nextImg }}" aria-label="Sledeća" style="position:absolute;right:3vw;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,0.14);border:1px solid rgba(255,255,255,0.28);color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .2s ease,transform .2s ease,color .2s ease;" style-hover="background:linear-gradient(135deg,#16C0CA,#0E9AA4);color:#fff;transform:scale(1.08);"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>
    <div style="position:absolute;bottom:26px;left:50%;transform:translateX(-50%);color:#E4EAE9;font-size:14px;font-weight:500;letter-spacing:1px;">{{ lightboxCounter }}</div>
  </div>
</sc-if>
<nav style="position:sticky;top:0;z-index:50;background:rgba(247,246,242,0.82);backdrop-filter:blur(14px);border-bottom:1px solid rgba(18,32,31,0.08);padding:12px 40px;">
  <div style="max-width:1240px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;">
    <a href="index.html" style="display:flex;align-items:center;"><img src="assets/logo-nebojsa-t.png" alt="Dr Nebojša dental" style="height:58px;width:auto;display:block;" /></a>
    <div style="display:flex;align-items:center;gap:12px;">
      <a href="index.html" style="display:inline-flex;align-items:center;gap:9px;background:#fff;border:1px solid rgba(18,32,31,0.14);color:#12201F;font-weight:600;padding:11px 22px;border-radius:999px;font-size:15px;transition:transform .2s ease,border-color .2s ease;" style-hover="transform:scale(1.04);border-color:rgba(14,154,164,0.55);">← Nazad na sajt</a>
    </div>
  </div>
</nav>

<section style="padding:80px 40px 100px;">
  <div style="max-width:1240px;margin:0 auto;">
    <div style="max-width:640px;margin-bottom:50px;animation:fadeUp .7s ease both;">
      <div style="font-size:14px;letter-spacing:2px;color:#0E9AA4;font-weight:700;text-transform:uppercase;margin-bottom:14px;">Galerija</div>
      <h1 style="font-family:'Space Grotesk',sans-serif;font-weight:700;font-size:52px;line-height:1.05;letter-spacing:-1.5px;margin:0 0 16px;padding-bottom:0.08em;color:#0E1A19;">Naša ordinacija i rezultati</h1>
      <p style="font-size:18px;color:#54615F;line-height:1.6;margin:0;text-wrap:pretty;">Pogledajte prostor, opremu i osmehe naših pacijenata. Za više pratite nas na <a href="https://www.facebook.com/drnebojsadental" target="_blank">Facebooku</a>.</p>
    </div>
    <div class="gal-grid" style="display:grid;grid-template-columns:repeat(3,1fr);grid-auto-rows:300px;gap:16px;">
      <sc-for list="{{ images }}" as="im" hint-placeholder-count="0">
        <div class="gal-item gal-tile" data-idx="{{ im.idx }}" onClick="{{ im.open }}" style="cursor:pointer;">
          {{ im.el }}
        </div>
      </sc-for>
    </div>
    <div style="display:flex;flex-direction:column;align-items:center;gap:26px;margin-top:56px;">
      <a href="index.html#kontakt" style="display:inline-flex;align-items:center;gap:10px;background:linear-gradient(135deg,#16C0CA,#0E9AA4);color:#fff;font-weight:700;font-size:16px;padding:16px 32px;border-radius:999px;box-shadow:0 16px 40px rgba(14,154,164,0.3);transition:transform .2s ease,box-shadow .2s ease;" style-hover="transform:scale(1.05);box-shadow:0 22px 52px rgba(14,154,164,0.42);">Zakažite pregled</a>
      <a href="index.html" style="display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid rgba(18,32,31,0.14);color:#12201F;font-weight:600;font-size:15px;padding:13px 26px;border-radius:999px;transition:transform .2s ease,border-color .2s ease,box-shadow .2s ease;" style-hover="transform:scale(1.04);border-color:rgba(14,154,164,0.55);box-shadow:0 12px 28px rgba(14,154,164,0.16);">← Nazad na početnu</a>
    </div>
  </div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:900}}">
class Component extends DCLogic {
  state = { lb: null };

  componentDidMount() {
    this._galleryReveal();
    this._onKey = (e) => {
      if (this.state.lb == null) return;
      if (e.key === 'Escape') this.setState({ lb: null });
      if (e.key === 'ArrowRight') this.setState(s => ({ lb: (s.lb + 1) % this._galN }));
      if (e.key === 'ArrowLeft') this.setState(s => ({ lb: (s.lb + this._galN - 1) % this._galN }));
    };
    document.addEventListener('keydown', this._onKey);
  }

  componentWillUnmount() {
    if (this._gio) this._gio.disconnect();
    document.removeEventListener('keydown', this._onKey);
  }

  _galleryReveal() {
    const tiles = Array.from(document.querySelectorAll('.gal-tile'));
    tiles.forEach(el => {
      el.style.opacity = '0';
      el.style.transform = 'translateY(48px)';
      el.style.transition = 'opacity .6s cubic-bezier(.2,.7,.2,1), transform .6s cubic-bezier(.2,.7,.2,1)';
      el.style.willChange = 'opacity, transform';
    });
    const show = el => { el.style.opacity = '1'; el.style.transform = 'none'; };
    if ('IntersectionObserver' in window) {
      this._gio = new IntersectionObserver((es) => {
        es.forEach(e => {
          if (e.isIntersecting) {
            const col = (+e.target.getAttribute('data-idx')) % 3;
            setTimeout(() => show(e.target), col * 140);
            this._gio.unobserve(e.target);
          }
        });
      }, { threshold: 0, rootMargin: '0px 0px -20% 0px' });
      tiles.forEach(el => this._gio.observe(el));
    } else { tiles.forEach(show); }
  }

  renderVals() {
    const files = ["reception","before-after","window-chair","chair-xray","tools","lamp","aligner","pano-xray","exam","autoclave","sink","selfie"];
    const srcs = files.map(f => "assets/gallery/" + f + ".png");
    this._galN = srcs.length;
    const images = srcs.map((src, i) => ({ idx: i, open: () => this.setState({ lb: i }), el: React.createElement('img', { src, alt: 'Dr Nebojša dental galerija' }) }));
    const lb = this.state.lb;
    return {
      images,
      lightboxOpen: lb != null,
      lightboxImg: lb != null ? React.createElement('img', { src: srcs[lb], onClick: (e) => e.stopPropagation(), alt: 'Dr Nebojša dental galerija', style: { width: 'min(1500px,82vw)', height: 'auto', maxHeight: '90vh', objectFit: 'contain', borderRadius: '14px', boxShadow: '0 30px 90px rgba(0,0,0,0.5)' } }) : null,
      lightboxCounter: (lb != null ? lb + 1 : 0) + " / " + srcs.length,
      closeLightbox: () => this.setState({ lb: null }),
      prevImg: (e) => { e.stopPropagation(); this.setState(s => ({ lb: (s.lb + srcs.length - 1) % srcs.length })); },
      nextImg: (e) => { e.stopPropagation(); this.setState(s => ({ lb: (s.lb + 1) % srcs.length })); },
      stopProp: (e) => e.stopPropagation(),
    };
  }
}
</script>
</body>
</html>
